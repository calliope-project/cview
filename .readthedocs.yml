version: 2
build:
  os: "ubuntu-24.04"
  tools:
    python: "3.12"

# mkdocstrings and mkdocs-click both import `calligraph.cli`, so the package
# itself has to be installed, not just the documentation tooling.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

mkdocs:
  configuration: mkdocs.yml
