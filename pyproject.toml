[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calligraph"
authors = [
  { name = "Stefan Pfenninger", email = "stefan@pfenninger.org" },
]
maintainers = [
  { name = "Stefan Pfenninger", email = "stefan@pfenninger.org" },
  { name = "Bryn Pickering", email = "17178478+brynpickering@users.noreply.github.com" },
]
description = "Visualisation tool for Calliope."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["energy systems", "visualisation"]
license = "Apache-2.0"
license-files = ["LICENSE", "CITATION"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dynamic = ["version"]
dependencies = [
  "calliope>=0.7.0.dev7,<0.8.0",
  "panel>=1.7.5",
  "plotly>=6.3",
  "pyproj>=3.7",
  "click>=8.2",
  "bokeh>=3",
  "param>=2",
  "xyzservices>=2023.10",
  "pandas>=2,<3",
  "xarray>=2024.1",
]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.5",
  "mkdocs-click>=0.6",
  "mkdocs-material>=9.5",
  "mkdocstrings-python>=1.7",
]

[project.scripts]
calligraph = "calligraph.cli:calligraph_cli"

[project.urls]
website = "https://www.callio.pe/"
repository = "https://github.com/calliope-project/calligraph"
changelog = "https://github.com/calliope-project/calligraph/CHANGELOG.md"

[tool.hatch.version]
path = "src/calligraph/_version.py"

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.sdist]
only-include = ["src", "LICENSE", "CITATION", "README.md"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
panel = ">=1.7.5"
plotly = ">=6.3"
pyproj = ">=3.7"
click = ">=8.2"
netcdf4 = "*"
pandas = ">=2,<3"
ruff = ">=0.15"
pytest = ">=8"
pre-commit = ">=3"
uv = ">=0.9"

[tool.pixi.pypi-dependencies]
calligraph = { path = ".", editable = true, extras = ["docs"] }

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.environments]
default = { features = ["py312"], solve-group = "py312" }
py310 = { features = ["py310"] }
py311 = { features = ["py311"] }
py312 = { features = ["py312"], solve-group = "py312" }

[tool.pixi.tasks]
lint = "ruff check src/ tests/"
format = "ruff format src/ tests/"
format-check = "ruff format --check src/ tests/"
test = "pytest"
check = { depends-on = ["lint", "format-check", "test"] }
build = "uv build"
docs-build = "mkdocs build"
docs-serve = "mkdocs serve"
pre-commit-install = "pre-commit install"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "Q", "W"]
# line too long; the formatter handles these
ignore = ["E501"]

[tool.ruff.lint.isort]
# Must stay equal to format.skip-magic-trailing-comma
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

# Ignore `E402` (import violations) and `F401` (unused imports) in all `__init__.py` files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 200
ignore-overlong-task-comments = true

[tool.codespell]
skip = "pixi.lock"
quiet-level = 3
