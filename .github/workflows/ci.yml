name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - LICENSE
      - CITATION
      - docs/**
      - mkdocs.yml
      - .readthedocs.yml
      - .pre-commit-config.yaml
  pull_request:
    branches:
      - "main"

concurrency:
  # Use github.run_id on main, the PR number on pull requests, and github.ref
  # otherwise, so that a group is unique per branch or per pull request.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        # The floor is what `requires-python` claims.
        py3version: ["10", "11", "12"]
        include:
          - os: windows-latest
            py3version: "12"
          - os: macos-latest
            py3version: "12"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.73.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: ${{ format('py3{0}', matrix.py3version) }}
          manifest-path: pyproject.toml

      - name: Lint
        run: pixi run -e ${{ format('py3{0}', matrix.py3version) }} lint

      - name: Check formatting
        run: pixi run -e ${{ format('py3{0}', matrix.py3version) }} format-check

      - name: Test
        run: pixi run -e ${{ format('py3{0}', matrix.py3version) }} test
