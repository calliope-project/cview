name: Publish to PyPI (test)

permissions:
  contents: read
  id-token: write

on:
  pull_request:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pip-test:
    environment:
      name: pre-release
    runs-on: ubuntu-latest
    if: startsWith(github.event.pull_request.title, 'Release v')
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      # Not the latest Python: calliope 0.7.0.dev7 pins `xarray < 2024.4`, and the
      # rest of the stack is only pinned against that on 3.12 and below.
      - name: Install Python
        run: uv python install 3.12

      - name: Build
        run: uv build

      # Both artefacts, because a wheel can be fine while the sdist is missing a
      # file the build needs — and the sdist is what conda-forge would consume.
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl calligraph --help

      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz calligraph --help

      - name: Publish on success
        run: uv publish --index testpypi --trusted-publishing always

      # `--prerelease allow` because both calligraph and its calliope dependency
      # are still pre-releases, which uv refuses to resolve for a bare requirement.
      - name: Test successful publication
        run: >-
          uv run --with calligraph --refresh-package calligraph --index testpypi
          --no-project --prerelease allow -- calligraph --help
