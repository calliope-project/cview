name: Publish to PyPI

on:
  release:
    types: [released]

# Build and publish are separate jobs so that `id-token: write` — which is what
# trusted publishing signs with — is held by as few steps as possible.
jobs:
  pypi-build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dists
          path: dist/

  pypi-publish:
    needs: [pypi-build]
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download build artifacts from the build job
        uses: actions/download-artifact@v8
        with:
          name: dists
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      # `always` rather than uv's default `automatic`: automatic attempts the OIDC
      # exchange but falls back to other credential sources if it fails, so a
      # misconfigured publisher would surface as "no credentials" rather than as
      # the trusted-publishing error that actually explains it.
      - name: Publish
        run: uv publish --trusted-publishing always
